name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: |
        cd backend
        npm install
        
    - name: Run tests
      run: |
        cd backend
        npm test
      
    - name: Build status
      if: success()
      run: echo "✅ All tests passed successfully!"
      
    - name: Build failed
      if: failure()
      run: echo "❌ Tests failed. Please check the logs."
